<!doctype html>
<html lang="en">
  <head>
    <!-- Basic Setup -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Maison Sombre | Luxury Perfume House & Signature Fragrances</title>

    <meta 
      name="description" 
      content="Maison Sombre is a luxury perfume house crafting signature fragrances from rare ingredients. Discover timeless scents designed for elegance, identity, and lasting impressions." 
    />

    <meta 
      name="keywords" 
      content="luxury perfume, niche fragrance, Maison Sombre, signature scent, premium perfumes, oud fragrance, designer perfumes, long lasting perfumes" 
    />

    <meta name="author" content="Maison Sombre" />

    <!-- Open Graph (Social Sharing) -->
    <meta property="og:title" content="Maison Sombre | Luxury Perfume House" />
    <meta 
      property="og:description" 
      content="Where fragrance becomes identity. Explore rare, handcrafted perfumes designed to leave a lasting impression." 
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yourdomain.com" />
    <meta property="og:image" content="https://yourdomain.com/og-image.jpg" />

    <!-- Twitter (X) SEO -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Maison Sombre | Signature Luxury Fragrances" />
    <meta 
      name="twitter:description" 
      content="Discover bold, elegant, and timeless perfumes crafted from the world's finest ingredients." 
    />
    <meta name="twitter:image" content="https://yourdomain.com/og-image.jpg" />

    <!-- Branding & Technical SEO -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="canonical" href="https://yourdomain.com" />

    <!-- Optional: Theme Color (for mobile browsers) -->
    <meta name="theme-color" content="#0a0a0a" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
